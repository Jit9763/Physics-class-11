<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Physics Simulator - X Y Z Axis</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.8);
      padding: 8px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      border-radius: 4px;
    }
    #variables {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.8);
      padding: 8px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      border-radius: 4px;
      width: 180px;
    }
    #controls {
      position: absolute;
      top: 70px;
      left: 10px;
      background: rgba(255,255,255,0.9);
      padding: 8px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      border-radius: 4px;
      width: 280px;
    }
    input { width: 60px; }
    button { margin: 2px; padding: 4px 8px; }
    label { display: block; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="overlay">X:0, Y:0, Z:0 | Distances → X:0, Y:0, Z:0</div>
  <div id="variables">Time:0s<br>Distance:0<br>Displacement:0</div>
  <div id="controls">
    <strong>Motion Type (गति का प्रकार):</strong><br>
    <button onclick="setMotion('uniform')">Uniform (समान गति)</button>
    <button onclick="setMotion('nonuniform')">Non-Uniform (असमान गति)</button>
    <button onclick="setMotion('accelerated')">Accelerated (त्वरित गति)</button>
    <hr>
    <label>Speed (गति): <input type="range" id="speed" min="0.01" max="0.2" step="0.01" value="0.05"></label>
    <label>Amplitude (आयाम): <input type="range" id="amplitude" min="1" max="5" step="0.5" value="3"></label>
    <hr>
    <strong>Manual Coordinates:</strong><br>
    X: <input type="number" id="xCoord" value="0" step="0.5">
    Y: <input type="number" id="yCoord" value="0" step="0.5">
    Z: <input type="number" id="zCoord" value="0" step="0.5"><br>
    <button onclick="moveBall()">Move Object</button>
    <hr>
    <strong>Rotate Axis:</strong><br>
    <button onclick="rotateScene('x')">Rotate X</button>
    <button onclick="rotateScene('y')">Rotate Y</button>
    <button onclick="rotateScene('z')">Rotate Z</button>
    <hr>
    <button onclick="toggleAnimation()">Pause/Play</button>
  </div>
  <canvas id="canvas"></canvas>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(6,6,6);
    camera.lookAt(0,0,0);

    const renderer = new THREE.WebGLRenderer({canvas:document.getElementById("canvas")});
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Axes Helper
    const axesHelper = new THREE.AxesHelper(5);
    scene.add(axesHelper);

    // Ball
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.2,32,32), new THREE.MeshBasicMaterial({color:0x0000ff}));
    scene.add(ball);

    const overlay=document.getElementById("overlay");
    const variables=document.getElementById("variables");

    let motionType="uniform"; 
    let t=0; 
    let totalDistance=0; 
    let prevPos=new THREE.Vector3(0,0,0);
    let isAnimating=true;

    // Smooth transition target
    let targetPos=null;

    // Motion type
    window.setMotion=function(type){
      motionType=type;
      t=0;
      totalDistance=0;
      isAnimating=true;
      targetPos=null;
    };

    // Manual move (smooth transition)
    window.moveBall=function(){
      const x=parseFloat(document.getElementById("xCoord").value);
      const y=parseFloat(document.getElementById("yCoord").value);
      const z=parseFloat(document.getElementById("zCoord").value);
      targetPos=new THREE.Vector3(x,y,z);
      isAnimating=false; // stop auto motion
    };

    // Pause/Play
    window.toggleAnimation=function(){
      isAnimating=!isAnimating;
      targetPos=null;
    };

    // Rotate scene
    window.rotateScene=function(axis){
      if(axis==="x") scene.rotation.x+=0.1;
      if(axis==="y") scene.rotation.y+=0.1;
      if(axis==="z") scene.rotation.z+=0.1;
    };

    window.addEventListener("resize",()=>{
      camera.aspect=window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });

    function animate(){
      requestAnimationFrame(animate);
      const speed=parseFloat(document.getElementById("speed").value);
      const amplitude=parseFloat(document.getElementById("amplitude").value);

      if(isAnimating){
        if(motionType==="uniform"){
          ball.position.x=(t%(2*amplitude))-amplitude;
          ball.position.y=0; ball.position.z=0;
        } else if(motionType==="nonuniform"){
          ball.position.x=Math.sin(t)*amplitude;
          ball.position.y=Math.cos(t)*amplitude/1.5;
          ball.position.z=Math.sin(t/2)*amplitude/2;
        } else if(motionType==="accelerated"){
          ball.position.x=t*speed*2;
          ball.position.y=0.5*0.1*t*t*speed;
          ball.position.z=0;
        }
        const currPos=ball.position.clone();
        totalDistance+=currPos.distanceTo(prevPos);
        prevPos.copy(currPos);
        t+=speed;
        variables.innerHTML=`Time:${(t/speed).toFixed(1)}s<br>Distance:${totalDistance.toFixed(2)}<br>Displacement:${currPos.length().toFixed(2)}`;
      }

      // Smooth transition to manual target
      if(targetPos){
        ball.position.lerp(targetPos,0.05); // gradual move
        if(ball.position.distanceTo(targetPos)<0.01){
          ball.position.copy(targetPos);
          targetPos=null; // stop once reached
        }
      }

      overlay.textContent=`X:${ball.position.x.toFixed(2)}, Y:${ball.position.y.toFixed(2)}, Z:${ball.position.z.toFixed(2)} | Distances → X:${Math.abs(ball.position.x).toFixed(2)}, Y:${Math.abs(ball.position.y).toFixed(2)}, Z:${Math.abs(ball.position.z).toFixed(2)}`;
      renderer.render(scene,camera);
    }
    animate();
  </script>
</body>
</html>
